<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOCUSLY - Schedule</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    color:#172033;
    padding-bottom:90px;
}

.header{
    background:#172033;
    color:white;
    padding:22px 20px;
    border-radius:0 0 25px 25px;
}

.header h1{
    font-size:25px;
}

.header p{
    font-size:13px;
    opacity:.8;
    margin-top:5px;
}

.container{
    padding:20px;
}

.back{
    display:inline-block;
    margin-bottom:18px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
}

.days{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:18px;
}

.day-btn{
    border:none;
    background:white;
    padding:11px 15px;
    border-radius:12px;
    font-weight:bold;
    white-space:nowrap;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.day-btn.active{
    background:#172033;
    color:white;
}

.lecture{
    background:white;
    padding:17px;
    border-radius:17px;
    margin-bottom:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.05);
}

.time{
    font-size:13px;
    color:#687386;
    margin-bottom:6px;
}

.subject{
    font-size:18px;
    font-weight:bold;
}

.room{
    font-size:13px;
    color:#687386;
    margin-top:6px;
}
</style>
</head>

<body>

<div class="header">
    <h1>🗓️ College Schedule</h1>
    <p>Plan your college day with FOCUSLY</p>
</div>

<div class="container">

    <div class="back" onclick="focuslyGo('index.html')">
        ← Back to Dashboard
    </div>

    <div class="days">

        <button class="day-btn active"
                onclick="showDay('Monday',this)">
            Monday
        </button>

        <button class="day-btn"
                onclick="showDay('Tuesday',this)">
            Tuesday
        </button>

        <button class="day-btn"
                onclick="showDay('Wednesday',this)">
            Wednesday
        </button>

        <button class="day-btn"
                onclick="showDay('Thursday',this)">
            Thursday
        </button>

        <button class="day-btn"
                onclick="showDay('Friday',this)">
            Friday
        </button>

        <button class="day-btn"
                onclick="showDay('Saturday',this)">
            Saturday
        </button>

    </div>

    <div id="scheduleList"></div>

</div>


<!-- COMMON NAVIGATION -->
<script src="nav.js"></script>

<script>

const schedules = {

    Monday: [
        {
            time:"9:00 AM - 10:00 AM",
            subject:"DBMS",
            room:"Room 101"
        },
        {
            time:"10:00 AM - 11:00 AM",
            subject:"Data Structures",
            room:"Lab 1"
        },
        {
            time:"11:15 AM - 12:15 PM",
            subject:"Digital System Architecture",
            room:"Room 203"
        }
    ],

    Tuesday: [
        {
            time:"9:00 AM - 10:00 AM",
            subject:"Python Programming",
            room:"Lab 2"
        },
        {
            time:"10:00 AM - 11:00 AM",
            subject:"Marketing Management",
            room:"Room 105"
        },
        {
            time:"11:15 AM - 12:15 PM",
            subject:"DBMS",
            room:"Room 101"
        }
    ],

    Wednesday: [
        {
            time:"9:00 AM - 10:00 AM",
            subject:"Data Structures",
            room:"Room 202"
        },
        {
            time:"10:00 AM - 11:00 AM",
            subject:"Python Programming",
            room:"Lab 2"
        }
    ],

    Thursday: [
        {
            time:"9:00 AM - 10:00 AM",
            subject:"Digital System Architecture",
            room:"Room 203"
        },
        {
            time:"10:00 AM - 11:00 AM",
            subject:"DBMS",
            room:"Room 101"
        },
        {
            time:"11:15 AM - 12:15 PM",
            subject:"Data Structures",
            room:"Lab 1"
        }
    ],

    Friday: [
        {
            time:"9:00 AM - 10:00 AM",
            subject:"Marketing Management",
            room:"Room 105"
        },
        {
            time:"10:00 AM - 11:00 AM",
            subject:"Python Programming",
            room:"Lab 2"
        }
    ],

    Saturday: [
        {
            time:"9:00 AM - 10:00 AM",
            subject:"Practical",
            room:"Computer Lab"
        },
        {
            time:"10:00 AM - 11:00 AM",
            subject:"Revision",
            room:"Room 101"
        }
    ]

};


function showDay(day,button){

    document.querySelectorAll(".day-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    const list = document.getElementById("scheduleList");

    list.innerHTML = "";

    schedules[day].forEach(lecture => {

        const card = document.createElement("div");

        card.className = "lecture";

        card.innerHTML = `
            <div class="time">
                🕒 ${lecture.time}
            </div>

            <div class="subject">
                ${lecture.subject}
            </div>

            <div class="room">
                📍 ${lecture.room}
            </div>
        `;

        list.appendChild(card);

    });

}


/* Start with Monday */

showDay(
    "Monday",
    document.querySelector(".day-btn")
);


/* Create common navigation */

createFocuslyNav("schedule");

</script>

</body>
</html>

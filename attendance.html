<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOCUSLY - Attendance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    color:#222;
    padding-bottom:80px;
}

header{
    background:#123c69;
    color:white;
    padding:18px;
    border-radius:0 0 20px 20px;
}

.header{
    display:flex;
    align-items:center;
    gap:15px;
}

.back{
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.subtitle{
    color:#666;
    margin:6px 0 20px;
}

.overall{
    background:white;
    padding:20px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

.overall-number{
    font-size:40px;
    font-weight:bold;
    color:#123c69;
    margin:8px 0;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.progress{
    height:100%;
    background:#123c69;
    width:0%;
}

.form-box{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

.form-box h3{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
}

.add-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#123c69;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.subject-card{
    background:white;
    padding:18px;
    border-radius:14px;
    margin-bottom:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.subject-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.subject-name{
    font-size:18px;
    font-weight:bold;
}

.percentage{
    font-size:20px;
    font-weight:bold;
    color:#123c69;
}

.stats{
    color:#666;
    font-size:13px;
    margin:10px 0;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.present,
.absent,
.delete{
    border:none;
    padding:10px 13px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.present{
    background:#e5f5ea;
    color:#19733a;
}

.absent{
    background:#fde8e8;
    color:#b42318;
}

.delete{
    background:#eee;
    color:#555;
}

.advice{
    margin-top:12px;
    padding:10px;
    background:#f4f6f8;
    border-radius:8px;
    font-size:13px;
    line-height:1.5;
}

.empty{
    background:white;
    padding:30px;
    text-align:center;
    border-radius:14px;
    color:#777;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    padding:11px 5px;
}

.nav-item{
    text-align:center;
    font-size:12px;
    color:#666;
}

.nav-item.active{
    color:#123c69;
    font-weight:bold;
}
</style>
</head>

<body>

<header>

    <div class="header">

        <div class="back" onclick="goHome()">←</div>

        <div>
            <div class="logo">FOCUSLY</div>
            <small>Attendance Tracker</small>
        </div>

    </div>

</header>


<div class="container">

    <h2>My Attendance 📊</h2>

    <p class="subtitle">
        Track your lectures and maintain your attendance.
    </p>


    <div class="overall">

        <div>Overall Attendance</div>

        <div class="overall-number" id="overall">
            0%
        </div>

        <div class="progress-bar">
            <div class="progress" id="overallProgress"></div>
        </div>

    </div>


    <div class="form-box">

        <h3>➕ Add Subject</h3>

        <input
            type="text"
            id="subjectName"
            placeholder="Subject name"
        >

        <button class="add-btn" onclick="addSubject()">
            Add Subject
        </button>

    </div>


    <h3 style="margin-bottom:12px;">
        Subjects
    </h3>

    <div id="subjectList"></div>

</div>


<div class="bottom-nav">

    <div class="nav-item" onclick="goHome()">
        🏠<br>
        Home
    </div>

    <div class="nav-item" onclick="goSchedule()">
        🗓️<br>
        Schedule
    </div>

    <div class="nav-item" onclick="goTasks()">
        ✅<br>
        Tasks
    </div>

    <div class="nav-item active">
        📊<br>
        Attendance
    </div>

    <div class="nav-item">
        👤<br>
        Profile
    </div>

</div>


<script>

let subjects = JSON.parse(
    localStorage.getItem("focuslyAttendance")
) || [];


function addSubject(){

    const name =
        document.getElementById("subjectName").value.trim();

    if(name === ""){

        alert("Please enter subject name.");

        return;
    }

    const subject = {

        id:Date.now(),

        name:name,

        total:0,

        attended:0

    };

    subjects.push(subject);

    save();

    document.getElementById("subjectName").value = "";

    display();

}


function present(id){

    subjects = subjects.map(function(subject){

        if(subject.id === id){

            subject.total++;

            subject.attended++;

        }

        return subject;

    });

    save();

    display();

}


function absent(id){

    subjects = subjects.map(function(subject){

        if(subject.id === id){

            subject.total++;

        }

        return subject;

    });

    save();

    display();

}


function deleteSubject(id){

    if(confirm("Delete this subject?")){

        subjects = subjects.filter(function(subject){

            return subject.id !== id;

        });

        save();

        display();

    }

}


function save(){

    localStorage.setItem(
        "focuslyAttendance",
        JSON.stringify(subjects)
    );

}


function getPercentage(subject){

    if(subject.total === 0){

        return 0;

    }

    return Math.round(
        (subject.attended / subject.total) * 100
    );

}


function requiredLectures(subject){

    let p = getPercentage(subject);

    if(p >= 75){

        return "✓ Attendance is at or above 75%.";

    }

    /*
      Calculate minimum future lectures
      needed to reach 75%.
    */

    let needed = 0;

    while(
        (subject.attended + needed) /
        (subject.total + needed) < 0.75
    ){

        needed++;

        if(needed > 1000){

            break;

        }

    }

    return "⚠️ Attend the next " +
           needed +
           " lecture(s) consecutively to reach 75%.";

}


function display(){

    const list =
        document.getElementById("subjectList");

    list.innerHTML = "";


    if(subjects.length === 0){

        list.innerHTML = `

            <div class="empty">

                📊<br><br>

                No subjects added yet.<br>

                Add your first subject above.

            </div>

        `;

        updateOverall();

        return;

    }


    subjects.forEach(function(subject){

        const percentage =
            getPercentage(subject);


        list.innerHTML += `

            <div class="subject-card">

                <div class="subject-top">

                    <div class="subject-name">
                        ${subject.name}
                    </div>

                    <div class="percentage">
                        ${percentage}%
                    </div>

                </div>


                <div class="stats">

                    Attended:
                    ${subject.attended}
                    /
                    ${subject.total}
                    lectures

                </div>


                <div class="progress-bar">

                    <div
                        class="progress"
                        style="width:${percentage}%"
                    ></div>

                </div>


                <div class="actions">

                    <button
                        class="present"
                        onclick="present(${subject.id})"
                    >
                        ✓ Present
                    </button>

                    <button
                        class="absent"
                        onclick="absent(${subject.id})"
                    >
                        ✕ Absent
                    </button>

                    <button
                        class="delete"
                        onclick="deleteSubject(${subject.id})"
                    >
                        🗑 Delete
                    </button>

                </div>


                <div class="advice">

                    ${requiredLectures(subject)}

                </div>

            </div>

        `;

    });


    updateOverall();

}


function updateOverall(){

    let total = 0;

    let attended = 0;


    subjects.forEach(function(subject){

        total += subject.total;

        attended += subject.attended;

    });


    let percentage = 0;


    if(total > 0){

        percentage =
            Math.round((attended / total) * 100);

    }


    document.getElementById("overall").innerText =
        percentage + "%";


    document.getElementById("overallProgress").style.width =
        percentage + "%";

}


function goHome(){

    window.location.href = "index.html";

}


function goSchedule(){

    window.location.href = "schedule.html";

}


function goTasks(){

    window.location.href = "tasks.html";

}


display();

</script>

</body>
</html>
